<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed - C6i | Portfolio</title>
    <style>
        /*
           COLOR PALETTE:
           Background: #0f172a (Deep Navy)
           Surface/Card: #1e293b (Slate Blue)
           Primary/Accent: #38bdf8 (Sky Blue)
           Text Primary: #f8fafc (Off White)
           Text Secondary: #94a3b8 (Muted Slate)
        */

        /* CSS Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        section {
            padding: 5rem 0;
        }
        h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            color: #38bdf8;
        }

        /* Navigation Bar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid #1e293b;
        }
        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }
        .logo {
            font-weight: bold;
            font-size: 1.2rem;
            color: #38bdf8;
        }
        nav ul {
            display: flex;
            list-style: none;
        }
        nav ul li {
            margin-left: 1.5rem;
        }
        nav ul li a {
            text-decoration: none;
            color: #94a3b8;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }
        nav ul li a:hover {
            color: #38bdf8;
        }

        /* --- Header / Hero Section (WITH IMAGE BACKGROUND) --- */
        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* 
               1. The linear-gradient creates a dark overlay so text is readable.
               2. The url points to your image. 
            */
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), 
                        url('LpzsWii0_400x400.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed; /* Parallax effect */
        }
        header h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            /* Adding shadow to make name pop */
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }
        header p {
            font-size: 1.5rem;
            color: #38bdf8;
            font-weight: 300;
            letter-spacing: 1px;
            /* Adding shadow to sub-title */
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        /* About Section */
        #about p {
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* Skills Section */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
        }
        .skill-tag {
            background-color: #1e293b;
            color: #38bdf8;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-size: 0.9rem;
            border: 1px solid #38bdf844;
        }

        /* Projects Section */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }
